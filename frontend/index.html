<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Himmat Singh Rathore — Developer & Data Analyst</title>
  <meta name="description"
    content="Himmat Singh Rathore (WhiteHawk) — Python developer, Power BI analyst, full-stack & Flutter developer building digital systems for Indian Railways." />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" type="image/jpeg" href="/profile.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400..700&display=swap"
    rel="stylesheet">
  <script>
    // Apply saved theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
